<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose albums</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
a{color:#F4F5F7;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 28px; background: #0E0F12; color: #F4F5F7; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="app-2-connect.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; display: grid; place-items: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F5F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 5l-7 7 7 7"></path>
      </svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #A9ADB8">Step 2 of 2</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1.04; letter-spacing: -0.03em">What should be sent?</h1>
    <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.45; color: #A9ADB8">You can change this any time.</p>
  </div>

  <div style="display: flex; flex-direction: column; padding: 4px 18px; border-radius: 24px; background: #16171B">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Camera</span>
        <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">262 items · 11 GB</span>
      </div>
      <button type="button" role="switch" aria-checked="true" aria-label="Send Camera" style="flex: none; width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 16px; background: #8C9BFF; display: flex; justify-content: flex-end; cursor: pointer">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #0F1020"></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid #24262C">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Screenshots</span>
        <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">647 items · 340 MB</span>
      </div>
      <button type="button" role="switch" aria-checked="true" aria-label="Send Screenshots" style="flex: none; width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 16px; background: #8C9BFF; display: flex; justify-content: flex-end; cursor: pointer">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #0F1020"></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid #24262C">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">ChatGPT</span>
        <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">82 items</span>
      </div>
      <button type="button" role="switch" aria-checked="false" aria-label="Send ChatGPT" style="flex: none; width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 16px; background: #2F323A; display: flex; justify-content: flex-start; cursor: pointer">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #A9ADB8"></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid #24262C">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">WhatsApp</span>
        <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">19 items</span>
      </div>
      <button type="button" role="switch" aria-checked="false" aria-label="Send WhatsApp" style="flex: none; width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 16px; background: #2F323A; display: flex; justify-content: flex-start; cursor: pointer">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #A9ADB8"></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid #24262C">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Download</span>
        <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">19 items</span>
      </div>
      <button type="button" role="switch" aria-checked="false" aria-label="Send Download" style="flex: none; width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 16px; background: #2F323A; display: flex; justify-content: flex-start; cursor: pointer">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #A9ADB8"></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid #24262C">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Screen recordings</span>
        <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">12 items</span>
      </div>
      <button type="button" role="switch" aria-checked="false" aria-label="Send Screen recordings" style="flex: none; width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 16px; background: #2F323A; display: flex; justify-content: flex-start; cursor: pointer">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #A9ADB8"></span>
      </button>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 24px; background: #16171B">
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 16px; font-weight: 600">Older photos too</span>
      <span style="font-size: 13px; font-weight: 500; line-height: 1.35; color: #A9ADB8">Sends what's already here, newest first</span>
    </div>
    <button type="button" role="switch" aria-checked="true" aria-label="Send older photos too" style="flex: none; width: 52px; height: 32px; padding: 4px; border: 0; border-radius: 16px; background: #8C9BFF; display: flex; justify-content: flex-end; cursor: pointer">
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #0F1020"></span>
    </button>
  </div>

  <a href="app-home-phone.html" style="margin-top: auto; height: 58px; border-radius: 19px; background: #8C9BFF; color: #0F1020; display: grid; place-items: center; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 18px; font-weight: 700">Start sending</a>
</div>
</body>
</html>
