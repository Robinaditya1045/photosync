<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home on a sending phone</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
a{color:#8C9BFF;text-decoration:none}a:hover{color:#B4BEFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; background: #0E0F12; color: #F4F5F7; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="2.5" width="13" height="13" rx="3.5" fill="#8C9BFF" opacity="0.45" transform="rotate(9 14.5 9)"></rect>
        <rect x="3" y="7" width="14.5" height="14.5" rx="4" fill="#8C9BFF"></rect>
        <circle cx="8" cy="12" r="1.7" fill="#0E0F12"></circle>
        <path d="M5.5 18.5l3.8-3.4 2.8 2.3 2.4-1.9" fill="none" stroke="#0E0F12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em">Photo Sync</span>
    </div>
    <button type="button" aria-label="Settings" style="width: 44px; height: 44px; margin-right: -8px; padding: 0; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F5F7" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7.5h9"></path>
        <path d="M18.5 7.5H20"></path>
        <circle cx="15.8" cy="7.5" r="2.4"></circle>
        <path d="M4 16.5h1.5"></path>
        <path d="M11 16.5h9"></path>
        <circle cx="8.2" cy="16.5" r="2.4"></circle>
      </svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 28px; background: #16171B">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 68px; font-weight: 800; line-height: 0.92; letter-spacing: -0.035em">128</span>
        <span style="font-size: 16px; font-weight: 600">left to send</span>
        <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">3.2 GB to go · Pixel connected</span>
      </div>
      <div style="display: grid; place-items: center; width: 104px; height: 104px; flex: none">
        <svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="71 percent sent" style="grid-area: 1 / 1">
          <circle cx="52" cy="52" r="44" fill="none" stroke="#2C2F37" stroke-width="12"></circle>
          <circle cx="52" cy="52" r="44" fill="none" stroke="#8C9BFF" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="71 100" transform="rotate(-90 52 52)"></circle>
        </svg>
        <span style="grid-area: 1 / 1; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">71%</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #24262C">
        <button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 12px; background: #8C9BFF; color: #0F1020; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Auto</button>
        <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 12px; background: transparent; color: #A9ADB8; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Paused</button>
      </div>
      <span style="font-size: 12.5px; font-weight: 500; line-height: 1.4; color: #A9ADB8">Auto sends whenever this phone and the Pixel are on home Wi-Fi.</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">This week</span>
      <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">86 of 98 photos · 5 of 6 videos</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 10px; border-radius: 13px; background: #16171B">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="All sent">
          <circle cx="14" cy="14" r="12" fill="#3DDC97"></circle>
          <path d="M8.6 14.6l3.6 3.5 7.2-7.4" fill="none" stroke="#0B2A1C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 600; color: #A9ADB8">Thu</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 10px; border-radius: 13px; background: #16171B">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="All sent">
          <circle cx="14" cy="14" r="12" fill="#3DDC97"></circle>
          <path d="M8.6 14.6l3.6 3.5 7.2-7.4" fill="none" stroke="#0B2A1C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 600; color: #A9ADB8">Fri</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 10px; border-radius: 13px; background: #16171B">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="No photos taken">
          <path d="M9 14h10" fill="none" stroke="#6A6F7C" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 600; color: #A9ADB8">Sat</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 10px; border-radius: 13px; background: #16171B">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="All sent">
          <circle cx="14" cy="14" r="12" fill="#3DDC97"></circle>
          <path d="M8.6 14.6l3.6 3.5 7.2-7.4" fill="none" stroke="#0B2A1C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 600; color: #A9ADB8">Sun</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 10px; border-radius: 13px; background: #16171B">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="All sent">
          <circle cx="14" cy="14" r="12" fill="#3DDC97"></circle>
          <path d="M8.6 14.6l3.6 3.5 7.2-7.4" fill="none" stroke="#0B2A1C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 600; color: #A9ADB8">Mon</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 10px; border-radius: 13px; background: #16171B">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Most sent, 4 left">
          <circle cx="14" cy="14" r="11" fill="none" stroke="#3A3D46" stroke-width="4"></circle>
          <circle cx="14" cy="14" r="11" fill="none" stroke="#8C9BFF" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="78 100" transform="rotate(-90 14 14)"></circle>
        </svg>
        <span style="font-size: 12px; font-weight: 600; color: #A9ADB8">Tue</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10.5px 0 8.5px; border-radius: 13px; background: #1D2040; border: 1.5px solid #8C9BFF">
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Sending, 9 left">
          <circle cx="14" cy="14" r="11" fill="none" stroke="#3A3F6B" stroke-width="4"></circle>
          <circle cx="14" cy="14" r="11" fill="none" stroke="#8C9BFF" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="30 100" transform="rotate(-90 14 14)"></circle>
        </svg>
        <span style="font-size: 12px; font-weight: 700; color: #F4F5F7">Today</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Albums</span>
      <a href="app-3-albums.html" style="font-size: 14px; font-weight: 600">Manage</a>
    </div>
    <div style="display: flex; flex-direction: column; padding: 4px 18px; border-radius: 24px; background: #16171B">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">Camera</span>
          <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">134 of 262 sent</span>
        </div>
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Sending">
          <circle cx="14" cy="14" r="11" fill="none" stroke="#3A3D46" stroke-width="4"></circle>
          <circle cx="14" cy="14" r="11" fill="none" stroke="#8C9BFF" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="51 100" transform="rotate(-90 14 14)"></circle>
        </svg>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-top: 1px solid #24262C">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">Screenshots</span>
          <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">All 647 sent</span>
        </div>
        <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="All sent">
          <circle cx="14" cy="14" r="12" fill="#3DDC97"></circle>
          <path d="M8.6 14.6l3.6 3.5 7.2-7.4" fill="none" stroke="#0B2A1C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 24px; background: #16171B">
    <div style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: #12382A; display: grid; place-items: center">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7.5 18.5a4.5 4.5 0 0 1-.7-8.95A6 6 0 0 1 18.4 10a4.3 4.3 0 0 1-.9 8.5"></path>
        <path d="M12 20v-7.5"></path>
        <path d="M9 15.2l3-3 3 3"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 600">Pixel</span>
      <span style="font-size: 13px; font-weight: 500; color: #A9ADB8">Hub · 9.2 GB free</span>
    </div>
  </div>
</div>
</body>
</html>
