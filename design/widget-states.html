<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget states</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 800px; height: 236px; box-sizing: border-box; padding: 32px; background: #E4E8F0; font-family: 'Inter', system-ui, sans-serif; display: flex; gap: 16px">

  <div style="width: 172px; height: 172px; box-sizing: border-box; padding: 14px; border-radius: 28px; background: #16171B; color: #F4F5F7; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #24262C; display: grid; place-items: center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A9ADB8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.5 11.5L12 4l8.5 7.5"></path>
        <path d="M6 10v9.5h12V10"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 17px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Waiting for home</span>
      <span style="font-size: 12.5px; font-weight: 500; line-height: 1.35; color: #A9ADB8">128 to send once you're on home Wi-Fi</span>
    </div>
  </div>

  <div style="width: 172px; height: 172px; box-sizing: border-box; padding: 14px; border-radius: 28px; background: #16171B; color: #F4F5F7; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #3A2E12; display: grid; place-items: center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFC24D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.5 10a10.5 10.5 0 0 1 15 0"></path>
        <path d="M8 13.6a5.8 5.8 0 0 1 8 0"></path>
        <circle cx="12" cy="17.6" r="1" fill="#FFC24D"></circle>
        <path d="M4 3.5l16 17"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 17px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Can't find the Pixel</span>
      <span style="font-size: 12.5px; font-weight: 500; line-height: 1.35; color: #A9ADB8">Seen 2 h ago. Is it on and charging?</span>
    </div>
  </div>

  <div style="width: 172px; height: 172px; box-sizing: border-box; padding: 14px; border-radius: 28px; background: #16171B; color: #F4F5F7; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #24262C; display: grid; place-items: center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#F4F5F7" stroke-width="2.8" stroke-linecap="round" aria-hidden="true">
        <path d="M9 6.5v11"></path>
        <path d="M15 6.5v11"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 17px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Paused</span>
      <span style="font-size: 12.5px; font-weight: 500; line-height: 1.35; color: #A9ADB8">128 waiting. Tap to resume.</span>
    </div>
  </div>

  <div style="width: 172px; height: 172px; box-sizing: border-box; padding: 14px; border-radius: 28px; background: #16171B; color: #F4F5F7; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #40230F; display: grid; place-items: center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FF9A4D" stroke-width="2.8" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5.5v8"></path>
        <circle cx="12" cy="18" r="0.9" fill="#FF9A4D"></circle>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 17px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em">Pixel is full</span>
      <span style="font-size: 12.5px; font-weight: 500; line-height: 1.35; color: #A9ADB8">Tap Free up space in Google Photos there</span>
    </div>
  </div>

</div>
</body>
</html>
