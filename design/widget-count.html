<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count widget</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 172px; height: 172px; box-sizing: border-box; padding: 12px 14px 14px; background: #16171B; color: #F4F5F7; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 2px">
  <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 62px; font-weight: 800; line-height: 0.95; letter-spacing: -0.035em">128</span>
  <span style="font-size: 14px; font-weight: 600">left to send</span>

  <div aria-hidden="true" style="position: absolute; right: -16px; bottom: -22px; width: 132px; height: 112px">
    <div style="position: absolute; left: 4px; top: 20px; width: 84px; height: 84px; border-radius: 19px; background: #2A2D55; transform: rotate(-19deg)"></div>
    <div style="position: absolute; left: 22px; top: 14px; width: 84px; height: 84px; border-radius: 19px; background: #5563D8; transform: rotate(-7deg)"></div>
    <div style="position: absolute; left: 42px; top: 14px; width: 84px; height: 84px; border-radius: 19px; background: #8C9BFF; transform: rotate(7deg); overflow: hidden">
      <div style="position: absolute; left: 15px; top: 15px; width: 16px; height: 16px; border-radius: 50%; background: #16171B"></div>
      <div style="position: absolute; left: -14px; top: 48px; width: 96px; height: 80px; border-radius: 50%; background: #16171B"></div>
      <div style="position: absolute; left: 44px; top: 56px; width: 80px; height: 70px; border-radius: 50%; background: #2A2D55"></div>
    </div>
  </div>
</div>
</body>
</html>
