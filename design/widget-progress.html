<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress widget</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 172px; height: 172px; box-sizing: border-box; padding: 14px; background: #16171B; color: #F4F5F7; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Sending</span>
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="8" y="2.5" width="13" height="13" rx="3.5" fill="#8C9BFF" opacity="0.45" transform="rotate(9 14.5 9)"></rect>
      <rect x="3" y="7" width="14.5" height="14.5" rx="4" fill="#8C9BFF"></rect>
      <circle cx="8" cy="12" r="1.7" fill="#16171B"></circle>
      <path d="M5.5 18.5l3.8-3.4 2.8 2.3 2.4-1.9" fill="none" stroke="#16171B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>

  <div style="display: flex; align-items: center; gap: 12px">
    <div style="display: grid; place-items: center; width: 78px; height: 78px; flex: none">
      <svg width="78" height="78" viewBox="0 0 78 78" role="img" aria-label="71 percent sent" style="grid-area: 1 / 1">
        <circle cx="39" cy="39" r="32" fill="none" stroke="#2C2F37" stroke-width="10"></circle>
        <circle cx="39" cy="39" r="32" fill="none" stroke="#8C9BFF" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="71 100" transform="rotate(-90 39 39)"></circle>
      </svg>
      <span style="grid-area: 1 / 1; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.02em">71%</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; font-weight: 600">
      <div style="display: flex; align-items: center; gap: 6px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8C9BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Photos sent">
          <rect x="3" y="5" width="18" height="14" rx="3.5"></rect>
          <circle cx="8.5" cy="10" r="1.4"></circle>
          <path d="M4.5 17l4.8-4 3.4 2.8 2.6-2 4.2 3.2"></path>
        </svg>
        <span>86/98</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8C9BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Videos sent">
          <rect x="2.5" y="6" width="13" height="12" rx="3.5"></rect>
          <path d="M15.5 10.6l5.5-3.2v9.2l-5.5-3.2"></path>
        </svg>
        <span>5/6</span>
      </div>
    </div>
  </div>

  <span style="font-size: 12px; font-weight: 500; color: #A9ADB8">128 left · to Pixel</span>
</div>
</body>
</html>
