<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub widget</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 364px; height: 172px; box-sizing: border-box; padding: 16px; background: #16171B; color: #F4F5F7; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="2.5" width="13" height="13" rx="3.5" fill="#3DDC97" opacity="0.45" transform="rotate(9 14.5 9)"></rect>
        <rect x="3" y="7" width="14.5" height="14.5" rx="4" fill="#3DDC97"></rect>
        <circle cx="8" cy="12" r="1.7" fill="#16171B"></circle>
        <path d="M5.5 18.5l3.8-3.4 2.8 2.3 2.4-1.9" fill="none" stroke="#16171B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Hub</span>
    </div>
    <span style="padding: 5px 11px; border-radius: 999px; background: #24262C; font-size: 12.5px; font-weight: 600">9.2 GB free</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px 9px; border-radius: 13px; background: #24262C">
      <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="All received">
        <circle cx="14" cy="14" r="12" fill="#3DDC97"></circle>
        <path d="M8.6 14.6l3.6 3.5 7.2-7.4" fill="none" stroke="#0B2A1C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
        <span style="font-size: 12.5px; font-weight: 700">Redmi</span>
        <span style="font-size: 11px; font-weight: 500; color: #A9ADB8">All in</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px 9px; border-radius: 13px; background: #24262C">
      <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Receiving, 71 percent">
        <circle cx="14" cy="14" r="11" fill="none" stroke="#3A3D46" stroke-width="4"></circle>
        <circle cx="14" cy="14" r="11" fill="none" stroke="#8C9BFF" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="71 100" transform="rotate(-90 14 14)"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
        <span style="font-size: 12.5px; font-weight: 700">Galaxy</span>
        <span style="font-size: 11px; font-weight: 500; color: #A9ADB8">128 left</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px 9px; border-radius: 13px; background: #24262C">
      <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="All received">
        <circle cx="14" cy="14" r="12" fill="#3DDC97"></circle>
        <path d="M8.6 14.6l3.6 3.5 7.2-7.4" fill="none" stroke="#0B2A1C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
        <span style="font-size: 12.5px; font-weight: 700">Tablet</span>
        <span style="font-size: 11px; font-weight: 500; color: #A9ADB8">All in</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px 9px; border-radius: 13px; background: #24262C">
      <svg width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Not seen lately">
        <path d="M9 14h10" fill="none" stroke="#6A6F7C" stroke-width="3" stroke-linecap="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
        <span style="font-size: 12.5px; font-weight: 700">Phone 4</span>
        <span style="font-size: 11px; font-weight: 500; color: #A9ADB8">3 days ago</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
