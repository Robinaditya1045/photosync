<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect to the hub</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
a{color:#F4F5F7;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; background: #0E0F12; color: #F4F5F7; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="app-1-role.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; display: grid; place-items: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F5F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 5l-7 7 7 7"></path>
      </svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #A9ADB8">Step 1 of 2</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 36px; font-weight: 800; line-height: 1.04; letter-spacing: -0.03em">Connect to your hub</h1>
    <p style="margin: 0; font-size: 16px; font-weight: 500; line-height: 1.45; color: #A9ADB8">Keep both phones on the same Wi-Fi.</p>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 24px; background: #16171B">
    <div style="flex: none; width: 48px; height: 48px; border-radius: 15px; background: #12382A; display: grid; place-items: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7.5 18.5a4.5 4.5 0 0 1-.7-8.95A6 6 0 0 1 18.4 10a4.3 4.3 0 0 1-.9 8.5"></path>
        <path d="M12 20v-7.5"></path>
        <path d="M9 15.2l3-3 3 3"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.01em">Pixel</span>
      <span style="font-size: 13px; font-weight: 600; color: #3DDC97">Found on this Wi-Fi</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <label for="pair-code" style="font-size: 14px; font-weight: 600">Code shown on the Pixel</label>
    <input id="pair-code" type="text" inputmode="numeric" value="482 915" style="width: 100%; height: 76px; box-sizing: border-box; padding: 0 12px; border-radius: 20px; border: 1.5px solid #8C9BFF; background: #16171B; color: #F4F5F7; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 0.14em; text-align: center; outline: none">
    <p style="margin: 0; font-size: 13px; font-weight: 500; line-height: 1.45; color: #A9ADB8">To see the code, open Photo Sync on the Pixel and tap Add a phone.</p>
  </div>

  <a href="app-3-albums.html" style="margin-top: auto; height: 58px; border-radius: 19px; background: #8C9BFF; color: #0F1020; display: grid; place-items: center; font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 18px; font-weight: 700">Connect</a>
</div>
</body>
</html>
