<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All safe widget</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 172px; height: 172px; box-sizing: border-box; padding: 14px; background: #3DDC97; color: #0B2A1C; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; gap: 4px">
  <span style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.03em">All safe</span>
  <span style="font-size: 14px; font-weight: 700">4,332 photos</span>
  <span style="font-size: 13px; font-weight: 600; color: #14432D">on Pixel</span>

  <div aria-hidden="true" style="position: absolute; right: -16px; bottom: -22px; width: 132px; height: 112px">
    <div style="position: absolute; left: 4px; top: 20px; width: 84px; height: 84px; border-radius: 19px; background: #2FBE80; transform: rotate(-19deg)"></div>
    <div style="position: absolute; left: 22px; top: 14px; width: 84px; height: 84px; border-radius: 19px; background: #1E8F5E; transform: rotate(-7deg)"></div>
    <div style="position: absolute; left: 42px; top: 14px; width: 84px; height: 84px; border-radius: 19px; background: #0B2A1C; transform: rotate(7deg); display: grid; place-items: center">
      <svg width="50" height="50" viewBox="0 0 50 50" style="margin: -10px 0 0 -10px">
        <path d="M12 26l9 9 17-19" fill="none" stroke="#3DDC97" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
